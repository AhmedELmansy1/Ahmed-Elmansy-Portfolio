<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- Screen Frame Title -->
  <text x="60" y="50" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#818CF8">Forests Team • Mobile Dashboard UI</text>
  <text x="60" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#94A3B8">Material 3 • Statistics Cards • Team Activity Feed</text>

  <!-- Mobile Phone Mockup Center Left -->
  <rect x="220" y="110" width="340" height="640" rx="36" fill="#030712" stroke="#374151" stroke-width="4"/>
  <rect x="235" y="125" width="310" height="610" rx="26" fill="#111827"/>
  <!-- Notch -->
  <rect x="330" y="135" width="120" height="20" rx="10" fill="#030712"/>

  <!-- Phone UI Header -->
  <text x="260" y="185" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Team Dashboard</text>
  <circle cx="510" cy="180" r="14" fill="rgba(239, 68, 68, 0.2)"/>
  <text x="505" y="185" font-family="sans-serif" font-size="11" fill="#EF4444">🔔3</text>

  <!-- Stats Grid on Phone -->
  <rect x="255" y="210" width="130" height="80" rx="12" fill="#1E293B"/>
  <text x="270" y="235" font-family="sans-serif" font-size="11" fill="#94A3B8">Total Tasks</text>
  <text x="270" y="270" font-family="sans-serif" font-size="24" font-weight="800" fill="#6366F1">28</text>

  <rect x="395" y="210" width="130" height="80" rx="12" fill="#1E293B"/>
  <text x="410" y="235" font-family="sans-serif" font-size="11" fill="#94A3B8">Completed</text>
  <text x="410" y="270" font-family="sans-serif" font-size="24" font-weight="800" fill="#10B981">92%</text>

  <!-- Activity List on Phone -->
  <text x="255" y="320" font-family="sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Recent Activity</text>

  <rect x="255" y="335" width="270" height="60" rx="10" fill="#1E293B"/>
  <circle cx="280" cy="365" r="12" fill="#6366F1"/>
  <text x="302" y="360" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFF">Ahmed Elmansy</text>
  <text x="302" y="378" font-family="sans-serif" font-size="10" fill="#94A3B8">Pushed BLoC State Update</text>

  <rect x="255" y="405" width="270" height="60" rx="10" fill="#1E293B"/>
  <circle cx="280" cy="435" r="12" fill="#10B981"/>
  <text x="302" y="430" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFF">Forests Team Admin</text>
  <text x="302" y="448" font-family="sans-serif" font-size="10" fill="#94A3B8">Approved Module #4</text>

  <!-- Right Side UI Card Feature Explanations -->
  <rect x="620" y="130" width="520" height="590" rx="20" fill="#111827" stroke="#1F2937" stroke-width="1.5"/>
  <text x="650" y="180" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Flutter Material 3 Architecture</text>

  <rect x="650" y="210" width="460" height="120" rx="12" fill="#1E293B"/>
  <text x="675" y="245" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#818CF8">📊 Dashboard &amp; Statistics Widget</text>
  <text x="675" y="275" font-family="system-ui, sans-serif" font-size="13" fill="#CBD5E1">Calculates real-time project metrics with BLoC Cubits.</text>
  <text x="675" y="300" font-family="system-ui, sans-serif" font-size="12" fill="#10B981">✓ Material 3 Card Elevation &amp; Smooth Animations</text>

  <rect x="650" y="350" width="460" height="120" rx="12" fill="#1E293B"/>
  <text x="675" y="385" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#F59E0B">🔔 Unread Badge Count Engine</text>
  <text x="675" y="415" font-family="system-ui, sans-serif" font-size="13" fill="#CBD5E1">Tracks unread team alerts and supports 'Mark All as Read'.</text>
  <text x="675" y="440" font-family="system-ui, sans-serif" font-size="12" fill="#10B981">✓ Dynamic Notification Badge Ticker</text>

  <rect x="650" y="490" width="460" height="190" rx="12" fill="#1E293B"/>
  <text x="675" y="525" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#06B6D4">🌐 Arabic / English RTL Support</text>
  <text x="675" y="555" font-family="system-ui, sans-serif" font-size="13" fill="#CBD5E1">Full right-to-left layout switching with custom Arabic Cairo typography.</text>
  <text x="675" y="585" font-family="sans-serif" font-size="12" fill="#F59E0B">تطبيق فلاتر استجابي باللغتين العربية والإنجليزية</text>
  <text x="675" y="610" font-family="system-ui, sans-serif" font-size="12" fill="#10B981">✓ Modular Localization Engine</text>
</svg>
