<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="150" r="250" fill="#EF4444" opacity="0.08" filter="blur(60px)"/>
  <circle cx="1000" cy="450" r="300" fill="#3B82F6" opacity="0.06" filter="blur(80px)"/>

  <!-- Top Status Bar -->
  <rect x="60" y="50" width="220" height="36" rx="18" fill="rgba(239, 68, 68, 0.12)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1"/>
  <circle cx="85" cy="68" r="5" fill="#EF4444"/>
  <text x="100" y="73" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#EF4444" letter-spacing="1">AI DIGITAL FORENSICS</text>

  <!-- Main Title -->
  <text x="60" y="145" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">AI-Powered Digital Forensics System</text>
  <text x="60" y="185" font-family="system-ui, sans-serif" font-size="20" font-weight="500" fill="#94A3B8">Multimedia Manipulation Detection • Deepfake Audio &amp; Video Analysis</text>

  <!-- Forensic Visual Mockup Card -->
  <rect x="60" y="230" width="1080" height="340" rx="20" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(51, 65, 85, 0.8)" stroke-width="1.5"/>

  <!-- Inner Pipeline Box 1: Image ELA & Grad-CAM -->
  <rect x="90" y="260" width="310" height="280" rx="14" fill="#0B0F19" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1"/>
  <text x="115" y="295" font-family="monospace" font-size="14" font-weight="700" fill="#EF4444">[1] IMAGE FORGERY (ELA)</text>

  <!-- Heatmap Graphic Mock -->
  <rect x="115" y="315" width="260" height="150" rx="8" fill="#1E293B"/>
  <circle cx="210" cy="380" r="50" fill="#EF4444" opacity="0.6"/>
  <circle cx="280" cy="400" r="35" fill="#F59E0B" opacity="0.5"/>
  <text x="125" y="340" font-family="monospace" font-size="10" fill="#38BDF8">Grad-CAM Heatmap</text>

  <text x="115" y="495" font-family="monospace" font-size="11" fill="#94A3B8">ResNet-50 / EfficientNet</text>
  <text x="115" y="515" font-family="monospace" font-size="11" fill="#10B981">Manipulation Score: 98.4%</text>

  <!-- Inner Pipeline Box 2: Audio Deepfake -->
  <rect x="435" y="260" width="330" height="280" rx="14" fill="#0B0F19" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>
  <text x="460" y="295" font-family="monospace" font-size="14" font-weight="700" fill="#3B82F6">[2] AUDIO DEEPFAKE (SPECTROGRAM)</text>

  <!-- Spectrogram Wave Mock -->
  <rect x="460" y="315" width="280" height="150" rx="8" fill="#1E293B"/>
  <path d="M 470 390 Q 510 330 550 390 T 630 390 T 710 390" fill="none" stroke="#06B6D4" stroke-width="2"/>
  <path d="M 470 410 Q 510 350 550 410 T 630 410 T 710 410" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.7"/>
  <text x="470" y="340" font-family="monospace" font-size="10" fill="#06B6D4">AASIST / XLS-R Spectrogram</text>

  <text x="460" y="495" font-family="monospace" font-size="11" fill="#94A3B8">MFCC Spectral Analysis</text>
  <text x="460" y="515" font-family="monospace" font-size="11" fill="#EF4444">Synthetic Voice Detected</text>

  <!-- Inner Pipeline Box 3: Cryptographic Evidence -->
  <rect x="795" y="260" width="315" height="280" rx="14" fill="#0B0F19" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
  <text x="820" y="295" font-family="monospace" font-size="14" font-weight="700" fill="#F59E0B">[3] EVIDENCE HASHING</text>

  <rect x="820" y="315" width="265" height="150" rx="8" fill="#1E293B"/>
  <text x="835" y="345" font-family="monospace" font-size="11" fill="#10B981">SHA-256 INTEGRITY:</text>
  <text x="835" y="375" font-family="monospace" font-size="9" fill="#94A3B8">e3b0c44298fc1c149afbf4c</text>
  <text x="835" y="395" font-family="monospace" font-size="9" fill="#94A3B8">8996fb92427ae41e4649b93</text>
  <text x="835" y="415" font-family="monospace" font-size="9" fill="#94A3B8">4ca495991b7852b855</text>

  <text x="820" y="495" font-family="monospace" font-size="11" fill="#94A3B8">FFmpeg Metadata Analysis</text>
  <text x="820" y="515" font-family="monospace" font-size="11" fill="#10B981">Court Report Generated</text>
</svg>
