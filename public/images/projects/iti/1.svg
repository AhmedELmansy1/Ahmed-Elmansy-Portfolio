<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#1A0B2E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <text x="60" y="50" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#C084FC">ITI Flutter Project • Login &amp; Auth Screen UI</text>
  <text x="60" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#94A3B8">Clean Architecture Presentation Layer • Authentication UseCase • Dio Remote Tokens</text>

  <!-- Mobile Screen Center -->
  <rect x="220" y="110" width="340" height="640" rx="36" fill="#030712" stroke="#374151" stroke-width="4"/>
  <rect x="235" y="125" width="310" height="610" rx="26" fill="#111827"/>

  <!-- Logo Icon -->
  <circle cx="390" cy="220" r="35" fill="rgba(168, 85, 247, 0.2)" stroke="#A855F7" stroke-width="2"/>
  <text x="375" y="228" font-family="sans-serif" font-size="24" font-weight="900" fill="#C084FC">ITI</text>

  <text x="320" y="285" font-family="sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Welcome Back</text>
  <text x="280" y="310" font-family="sans-serif" font-size="12" fill="#94A3B8">Login to access AI Recommendations</text>

  <!-- Email Input -->
  <rect x="265" y="340" width="250" height="48" rx="12" fill="#1E293B" stroke="#374151" stroke-width="1"/>
  <text x="285" y="369" font-family="sans-serif" font-size="12" fill="#94A3B8">ahmedelmansy1311@gmail.com</text>

  <!-- Password Input -->
  <rect x="265" y="400" width="250" height="48" rx="12" fill="#1E293B" stroke="#374151" stroke-width="1"/>
  <text x="285" y="429" font-family="sans-serif" font-size="12" fill="#94A3B8">••••••••••••••••</text>

  <!-- Login Button -->
  <rect x="265" y="470" width="250" height="48" rx="12" fill="#A855F7"/>
  <text x="365" y="500" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Login</text>

  <!-- Right Side Layer Architecture Explanation -->
  <rect x="620" y="120" width="520" height="620" rx="20" fill="#111827" stroke="#1F2937" stroke-width="2"/>
  <text x="650" y="170" font-family="sans-serif" font-size="20" font-weight="800" fill="#C084FC">Clean Architecture Authentication</text>

  <rect x="650" y="200" width="460" height="120" rx="12" fill="#1E293B"/>
  <text x="675" y="235" font-family="sans-serif" font-size="15" font-weight="700" fill="#60A5FA">🔒 Auth UseCase (Domain Layer)</text>
  <text x="675" y="265" font-family="sans-serif" font-size="13" fill="#CBD5E1">Encapsulates business rules for credentials validation &amp; session handling.</text>
  <text x="675" y="290" font-family="sans-serif" font-size="12" fill="#10B981">✓ Zero UI or API Framework Dependencies</text>

  <rect x="650" y="340" width="460" height="120" rx="12" fill="#1E293B"/>
  <text x="675" y="375" font-family="sans-serif" font-size="15" font-weight="700" fill="#38BDF8">🌐 Dio Remote Data Source (Data Layer)</text>
  <text x="675" y="405" font-family="sans-serif" font-size="13" fill="#CBD5E1">Communicates with REST APIs, parses JWT tokens and local encrypted storage.</text>
  <text x="675" y="430" font-family="sans-serif" font-size="12" fill="#10B981">✓ Automatic Bearer Token Interceptors</text>

  <rect x="650" y="480" width="460" height="220" rx="12" fill="#1E293B"/>
  <text x="675" y="515" font-family="sans-serif" font-size="15" font-weight="700" fill="#A855F7">✨ Gemini AI Recommendation Engine</text>
  <text x="675" y="545" font-family="sans-serif" font-size="13" fill="#CBD5E1">Connects to Gemini API endpoints to generate intelligent personalized items.</text>
  <text x="675" y="575" font-family="sans-serif" font-size="12" fill="#F59E0B">Gemini API Key integrated safely with repository abstraction</text>
  <text x="675" y="600" font-family="sans-serif" font-size="12" fill="#10B981">✓ BLoC State Emissions (Loading ➔ Success ➔ Error)</text>
</svg>
