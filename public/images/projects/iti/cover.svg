  <!-- Top Status -->
  <rect x="60" y="50" width="220" height="36" rx="18" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
  <circle cx="85" cy="68" r="5" fill="#A855F7"/>
  <text x="100" y="73" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#C084FC" letter-spacing="1">CLEAN ARCHITECTURE &amp; AI</text>

