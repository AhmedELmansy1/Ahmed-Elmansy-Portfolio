  <rect x="115" y="320" width="260" height="50" rx="8" fill="#1E293B"/>
  <text x="135" y="350" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Flutter UI &amp; Auth Views</text>

  <rect x="115" y="385" width="260" height="50" rx="8" fill="#1E293B"/>
