  <text x="240" y="350" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFF">Flutter Desktop Workstation</text>
  <text x="240" y="370" font-family="sans-serif" font-size="11" fill="#A855F7">AI Match: 98% Match</text>
  <text x="240" y="390" font-family="sans-serif" font-size="12" font-weight="800" fill="#10B981">$299.00</text>
  <text x="470" y="350" font-family="sans-serif" font-size="16" fill="#EF4444">❤️</text>

  <rect x="220" y="425" width="280" height="90" rx="12" fill="#1E293B"/>
  <text x="240" y="455" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFF">Cybersecurity Forensics Dongle</text>
  <text x="240" y="475" font-family="sans-serif" font-size="11" fill="#A855F7">AI Match: 95% Match</text>
  <text x="240" y="495" font-family="sans-serif" font-size="12" font-weight="800" fill="#10B981">$149.00</text>
  <text x="470" y="455" font-family="sans-serif" font-size="16" fill="#EF4444">❤️</text>

  <!-- Right Side Explanations -->
  <rect x="600" y="120" width="520" height="630" rx="20" fill="#111827" stroke="#1F2937" stroke-width="2"/>
  <text x="630" y="170" font-family="sans-serif" font-size="20" font-weight="800" fill="#FFF">Gemini AI &amp; Wishlist System</text>

  <rect x="630" y="200" width="460" height="120" rx="12" fill="#1E293B"/>
  <text x="655" y="235" font-family="sans-serif" font-size="15" font-weight="700" fill="#C084FC">🤖 Gemini LLM API Integration</text>
  <text x="655" y="265" font-family="sans-serif" font-size="13" fill="#CBD5E1">Generates dynamic real-time suggestions using prompt engineering.</text>
  <text x="655" y="290" font-family="sans-serif" font-size="12" fill="#10B981">✓ Formatted JSON Parsing into Dart Models</text>

  <rect x="630" y="340" width="460" height="120" rx="12" fill="#1E293B"/>
  <text x="655" y="375" font-family="sans-serif" font-size="15" font-weight="700" fill="#EC4899">❤️ Wishlist Management Engine</text>
  <text x="655" y="405" font-family="sans-serif" font-size="13" fill="#CBD5E1">Persists favorite items locally and syncs with remote repository.</text>
  <text x="655" y="430" font-family="sans-serif" font-size="12" fill="#10B981">✓ BLoC State Reaction (Added / Removed Alerts)</text>
