      <stop offset="0%" stop-color="#0F051D"/>
      <stop offset="50%" stop-color="#1E1035"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <text x="60" y="50" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#A855F7">ITI Flutter Project • Gemini AI Smart Recommendation Screen</text>
  <text x="60" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#94A3B8">Gemini AI Prompt Engineering • Product Recommendation • Wishlist Heart Toggle</text>

  <!-- Mobile Phone Mockup -->
  <rect x="180" y="120" width="360" height="630" rx="32" fill="#030712" stroke="#374151" stroke-width="3"/>
